<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A fully featured admin theme which can be used to build CRM, CMS, etc.">
        <meta name="author" content="Coderthemes">

        <link rel="shortcut icon" href="assets/images/favicon_1.ico">

    <body class="fixed-left">
        
        <!-- Begin page -->
        <div id="wrapper">

            <div class="content-page">

                <div class="content">
                    <div class="container">

                        <!-- Page-Title -->
                        <div class="row">
                            <div class="col-sm-12">
                                <h4 class="page-title">Google Maps</h4>
                                <ol class="breadcrumb">
                                    <li><a href="#">Ubold</a></li>
                                    <li><a href="#">Maps</a></li>
                                    <li class="active">Gmaps</li>
                                </ol>
                            </div>
                        </div>
                        
                        
                        <div class="row">
							<div class="col-lg-6">
								<div class="card-box">
									<h4 class="m-t-0 m-b-20 header-title"><b>Basic</b></h4>
									
									<div id="gmaps-basic" class="gmaps"></div>
								</div>
							</div>
							
							<div class="col-lg-6">
								<div class="card-box">
									<h4 class="m-t-0 m-b-20 header-title"><b>Markers</b></h4>
									
									<div id="gmaps-markers" class="gmaps"></div>
								</div>
							</div>
						</div>
						
						
						
						
						<div class="row">
							<div class="col-lg-6">
								<div class="card-box">
									<h4 class="m-t-0 m-b-20 header-title"><b>Polygons</b></h4>
									
									<div id="gmaps-polygons" class="gmaps"></div>
								</div>
							</div>
							
							<div class="col-lg-6">
								<div class="card-box">
									<h4 class="m-t-0 m-b-20 header-title"><b>Overlays</b></h4>
									
									<div id="gmaps-overlay" class="gmaps"></div>
								</div>
							</div>
						</div>
						
						
						
						<div class="row">
							<div class="col-lg-6">
								<div class="card-box">
									<h4 class="m-t-0 m-b-20 header-title"><b>Street View Panoramas</b></h4>
									
									<div id="panorama" class="gmaps-panaroma"></div>
								</div>
							</div>
							
							<div class="col-lg-6">
								<div class="card-box">
									<h4 class="m-t-0 m-b-20 header-title"><b>Routes</b></h4>
									
									<div id="gmaps-route" class="gmaps"></div>
								</div>
							</div>
						</div>
						
						
						
					
						
						<div class="row">
							<div class="col-lg-6">
								<div class="card-box">
									<h4 class="m-t-0 m-b-20 header-title"><b>Map Types</b></h4>
									
									<div id="gmaps-types" class="gmaps"></div>
								</div>
							</div>
							
							<div class="col-lg-6">
								<div class="card-box">
									<h4 class="m-t-0 m-b-20 header-title"><b>Context menu (right click on map)</b></h4>
									
									<div id="gmaps-menu" class="gmaps"></div>
								</div>
							</div>
						</div>
						
						


           			 </div> <!-- container -->
