    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A fully featured admin theme which can be used to build CRM, CMS, etc.">
        <meta name="author" content="Coderthemes">

        <link rel="shortcut icon" href="assets/images/favicon_1.ico">

        <title>Ubold - Responsive Admin Dashboard Template</title>

    <body class="fixed-left">
        
        <!-- Begin page -->
        <div id="wrapper">

            <!-- @component layout/topbar {"compactClass":""} -->


            <!-- @component layout/sidebar {"nav":{"page-chart-nvd3":" active","group-charts":" active"}} --> 



            <!-- ============================================================== -->
            <!-- Start right Content here -->
            <!-- ============================================================== -->                      
            <div class="content-page">
                <!-- Start content -->
                <div class="content">
                    <div class="container">

                        <!-- Page-Title -->
						<div class="row">
							<div class="col-sm-12">
								<h4 class="page-title">Nvd3 Charts</h4>
								<ol class="breadcrumb">
									<li>
										<a href="#">Ubold</a>
									</li>
									<li>
										<a href="#">Charts</a>
									</li>
									<li class="active">
										Nvd3
									</li>
								</ol>
							</div>
						</div>
						
                        
                        
                        <div class="row">
							<div class="col-sm-12">
								<div class="card-box">
									<h4 class="m-t-0 m-b-20 header-title"><b>Line Chart</b></h4>
									
									<div class="line-chart">
                                        <svg style="height:400px;width:100%"></svg>
                                    </div>
								</div>
							</div>
						</div>
						
						
						<div class="row">
							<div class="col-sm-12">
								<div class="card-box">
									<h4 class="m-t-0 m-b-20 header-title"><b>Discrete Bar Chart</b></h4>
									
									<div class="bar-chart">
                                        <svg style="height:400px;width:100%"></svg>
                                    </div>
								</div>
							</div>
						</div>
						
						
						<div class="row">
							<div class="col-sm-12">
								<div class="card-box">
									<h4 class="m-t-0 m-b-20 header-title"><b>Horizontal Grouped / Stacked Bar Chart</b></h4>
									
									<div class="multi-chart">
                                        <svg style="height:500px;width:100%"></svg>
                                    </div>
								</div>
							</div>
						</div>
						
						
						<div class="row">
							<div class="col-sm-12">
								<div class="card-box">
									<h4 class="m-t-0 m-b-20 header-title"><b>Scatter chart</b></h4>
									
									<div class="scatter-chart">
                                        <svg style="height:500px;width:100%"></svg>
                                    </div>
								</div>
							</div>
						</div>
						
						
						
						<div class="row">
							<div class="col-sm-12">
								<div class="card-box">
									<h4 class="m-t-0 m-b-20 header-title"><b>Pie Chart &amp; Donut Chart</b></h4>
									<div class="row">
										<div class="col-md-6">
											<div id="chart1">
		                                        <svg style="height:500px;width:100%"></svg>
		                                    </div>
										</div>
										
										<div class="col-md-6">
											<div id="chart2">
		                                        <svg style="height:500px;width:100%"></svg>
		                                    </div>
										</div>
									</div>
								</div>
							</div>
						</div>
						
					
                        

                    </div> <!-- container -->
                               
                </div> <!-- content -->

                <!-- @component layout/footer {"alignment":" text-right"} -->

            </div>
            
            
            <!-- ============================================================== -->
            <!-- End Right content here -->
