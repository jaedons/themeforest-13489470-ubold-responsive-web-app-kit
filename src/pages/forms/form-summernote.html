<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A fully featured admin theme which can be used to build CRM, CMS, etc.">
        <meta name="author" content="Coderthemes">

        <link rel="shortcut icon" href="assets/images/favicon_1.ico">

        <title>Ubold - Responsive Admin Dashboard Template</title>

        <link href="assets/plugins/summernote/dist/summernote.css" rel="stylesheet" />

        <!-- @component runtime/styles -->

        <!-- HTML5 Shiv and Respond.js IE8 support of HTML5 elements and media queries -->
        <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
        <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
        <script src="https://oss.maxcdn.com/libs/respond.js/1.3.0/respond.min.js"></script>
        <![endif]-->

        <script src="assets/js/modernizr.min.js"></script>
        
    </head>


    <body class="fixed-left">
        
        <!-- Begin page -->
        <div id="wrapper">

            <!-- @component layout/topbar {"compactClass":""} -->


            <!-- @component layout/sidebar {"nav":{"page-form-summernote":" active","group-forms":" active"}} --> 



            <!-- ============================================================== -->
            <!-- Start right Content here -->
            <!-- ============================================================== -->                      
            <div class="content-page">
                <!-- Start content -->
                <div class="content">
                    <div class="container">

                        <!-- Page-Title -->
                        <div class="row">
                            <div class="col-sm-12">
                                <h4 class="page-title">Summernote Editor</h4>
                                <ol class="breadcrumb">
                                    <li><a href="#">Ubold</a></li>
                                    <li><a href="#">Forms</a></li>
                                    <li class="active">Summernote Editor</li>
                                </ol>
                            </div>
                        </div>
                        
                        
                        <div class="row">
							<div class="col-sm-12">
								<div class="card-box">
									<h4 class="m-b-30 m-t-0 header-title"><b>Default Editor</b></h4>
									<div class="summernote">
										<h3>Hello Summernote</h3>
									</div>
								</div>
							</div>
						</div>

                        <!-- End row -->
                        
                        <div class="row">
							<div class="col-sm-12">
								<div class="card-box">
									<h4 class="m-t-0 m-b-30 header-title"><b>Inline Editor</b></h4>
									<div class="inline-editor">
										
										<h3>This is an Air-mode editable area.</h3>
										<ul>
											<li>
												Select a text to reveal the toolbar.
											</li>
											<li>
												Edit rich document on-the-fly, so elastic!
											</li>
										</ul>
										<p>
											End of air-mode area
										</p>
									</div>
								</div>
							</div>
						</div>

                        <!-- End row -->


                    </div> <!-- container -->
                               
                </div> <!-- content -->

                <!-- @component layout/footer {"alignment":""} -->

            </div>
            <!-- ============================================================== -->
            <!-- End Right content here -->
            <!-- ============================================================== -->


            <!-- @component layout/rightbar -->


        </div>
        <!-- END wrapper -->

        <script>
            var resizefunc = [];
        </script>

        <!-- jQuery  -->
        <!-- @component runtime/scripts -->


        <!-- @component runtime/theme-scripts -->

        <!--form validation init-->
        <script src="assets/plugins/summernote/dist/summernote.min.js"></script>

        <script>

            jQuery(document).ready(function(){

                $('.summernote').summernote({
                    height: 350,                 // set editor height
                    minHeight: null,             // set minimum height of editor
                    maxHeight: null,             // set maximum height of editor
                    focus: false                 // set focus to editable area after initializing summernote
                });
                
                $('.inline-editor').summernote({
                    airMode: true            
                });

            });
        </script>

	
	</body>
</html>
