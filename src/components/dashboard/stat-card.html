<div class="widget-bg-color-icon card-box{{classes}}">
    <div class="bg-icon bg-icon-{{tone}} pull-left">
        <i class="{{icon}} text-{{tone}}"></i>
    </div>
    <div class="text-right">
        <h3 class="text-dark"><b class="counter">{{value}}</b>{{suffix}}</h3>
        <p class="text-muted">{{label}}</p>
    </div>
    <div class="clearfix"></div>
</div>
